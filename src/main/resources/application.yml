spring:
  application:
    name: task-management-api

  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
    show-sql: true

  liquibase:
    enabled: false

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: mySuperSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm1234567890123456
  access-token:
    expiration: 900000
  refresh-token:
    expiration: 604800000

logging:
  level:
    com.taskmanagement: INFO
    org.springframework.security: INFO

file:
  upload-dir: ./uploads
