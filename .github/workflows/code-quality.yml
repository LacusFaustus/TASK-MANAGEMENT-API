name: Code Quality

on:
  push:
    branches: [ main, new, new1 ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check code quality
        run: |
          mvn checkstyle:check
          mvn spotbugs:check
